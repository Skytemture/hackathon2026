<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <title>新增餐具</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>新增餐具</h1>

    <p>請掃描 QR Code（CUP / PLATE / LID）</p>

    <div id="reader"></div>

    <h2 id="result"></h2>

</div>

<script>

let scanned = false;

function onScanSuccess(decodedText){

    if(scanned) return;
    scanned = true;

    fetch("/add_item", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            container_id: decodedText
        })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("result").innerText =
            data.message;

        // 2秒後允許重新掃描
        setTimeout(() => {
            scanned = false;
        }, 2000);
    });
}

let html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(devices => {

    if (devices.length){

        let cameraId = devices[0].id;

        html5QrCode.start(

            cameraId,

            {
                fps: 10,
                qrbox: 250
            },

            onScanSuccess
        );
    }
});

</script>

</body>
</html>
