<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>QR 掃描</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet"
          href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>QR 掃描</h1>

    <h2 id="current_user">
        請先掃描使用者
    </h2>

    <h2 id="mode">
        模式：未選擇
    </h2>

    <button onclick="setMode('borrow')">
        借用
    </button>

    <button onclick="setMode('return')">
        歸還
    </button>

    <br><br>

    <div id="reader"></div>

    <h2 id="result"></h2>

</div>

<script>

let scanning = false;
let currentMode = null;

// =====================
// 選模式
// =====================
function setMode(mode){

    currentMode = mode;

    document.getElementById("mode")
        .innerText =
        "模式：" +
        (mode === "borrow" ? "借用" : "歸還");
}

// =====================
// 掃描成功
// =====================
function onScanSuccess(decodedText){

    if(scanning) return;

    scanning = true;

    fetch("/scan_qr", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            container_id: decodedText,
            action: currentMode
        })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("result")
            .innerText =
            data.message;

        // user 掃描成功
        if(data.type === "user"){

            document.getElementById(
                "current_user"
            ).innerText =
                "目前使用者：" +
                data.user_name;
        }

        setTimeout(() => {
            scanning = false;
        }, 1500);
    });
}

// =====================
// 啟動相機
// =====================
let html5QrCode =
    new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(devices => {

    if(devices.length){

        html5QrCode.start(

            devices[0].id,

            {
                fps: 10,
                qrbox: 250
            },

            onScanSuccess
        );
    }
});

</script>

</body>
</html>
