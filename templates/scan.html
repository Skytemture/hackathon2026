<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>QR 掃描</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>QR 借還系統</h1>

    <!-- 👇 使用者登入 -->
    <input type="text" id="login_input" placeholder="輸入電話或名字">
    <button onclick="loginUser()">登入</button>

    <h3 id="user_status">未登入</h3>

    <br>

    <!-- 模式 -->
    <button onclick="setAction('borrow')">借出</button>
    <button onclick="setAction('return')">歸還</button>

    <h2 id="mode">目前模式：borrow</h2>

    <div id="reader"></div>

    <h2 id="result"></h2>

</div>

<script>

let currentAction = "borrow";
let isLogin = false;
let userName = "";

function setAction(action){
    currentAction = action;
    document.getElementById("mode").innerText =
        "目前模式：" + action;
}

// =========================
// LOGIN
// =========================
function loginUser(){

    let input = document.getElementById("login_input").value;

    fetch("/login_user", {

        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            input: input   // phone or name
        })
    })
    .then(res => res.json())
    .then(data => {

        if(data.status === "success"){

            isLogin = true;
            userName = data.user_name;

            document.getElementById("user_status").innerText =
                "已登入：" + userName;

        } else {
            alert(data.message);
        }
    });
}

// =========================
// QR SCAN
// =========================
function onScanSuccess(decodedText){

    if(!isLogin){
        alert("請先登入");
        return;
    }

    fetch("/scan_qr", {

        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({

            item_code: decodedText,
            action: currentAction
        })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("result").innerText =
            data.message;
    });
}

// =========================
// CAMERA
// =========================
let html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(devices => {

    if (devices.length){

        html5QrCode.start(
            devices[0].id,
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    }
});

</script>

</body>
</html>
