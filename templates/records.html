<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <title>
        歷史紀錄
    </title>

    <link rel="stylesheet"
          href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>歷史紀錄</h1>

    <a href="/">
        返回首頁
    </a>

    <br><br>

    <table>

        <tr>
            <th>ID</th>
            <th>QRCode</th>
            <th>類型</th>
            <th>動作</th>
            <th>使用者</th>
            <th>時間</th>
        </tr>

        {% for row in records %}

        <tr>

            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
